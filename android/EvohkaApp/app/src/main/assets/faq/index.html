<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ayuda EVOHKA</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main>
    <h1>¿Cómo podemos ayudarte?</h1>
    <p class="intro">Consulta las preguntas frecuentes de EVOHKA. Esta ayuda funciona sin conexión.</p>
    <label for="search">Buscar una pregunta</label>
    <input id="search" type="search" placeholder="Ejemplo: contrato o falla" autocomplete="off">
    <section id="faq" aria-live="polite"></section>
    <p id="empty" hidden>No encontramos una respuesta con esas palabras.</p>
  </main>
  <script src="app.js"></script>
</body>
</html>
